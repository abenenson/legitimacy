<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .pill { fill: #f8f9fb; stroke: #2f3b52; stroke-width: 1.6; }
      .edge { stroke: #8a94a6; stroke-width: 1.6; }
      .head { fill: #1f2937; font-size: 19px; font-weight: bold; }
      .sub  { fill: #4b5563; font-size: 13.5px; }
      .core { fill: #1f2937; font-size: 16px; font-weight: bold; }
      .coresub { fill: #4b5563; font-size: 13.5px; }
      .verdict { fill: #a13b34; font-size: 15px; font-weight: bold; }
    </style>
  </defs>

  <!-- triangle edges (between pill borders) -->
  <line class="edge" x1="328" y1="116" x2="178" y2="438"/>
  <line class="edge" x1="512" y1="116" x2="662" y2="438"/>
  <line class="edge" x1="262" y1="486" x2="578" y2="486"/>

  <!-- top: consistency -->
  <rect class="pill" x="280" y="44" width="280" height="72" rx="12"/>
  <text class="head" x="420" y="74" text-anchor="middle">Consistency</text>
  <text class="sub" x="420" y="98" text-anchor="middle">removing a denied claimant</text>
  <text class="sub" x="420" y="98" text-anchor="middle" dy="14">changes no other verdict</text>

  <!-- bottom-left: solidarity -->
  <rect class="pill" x="40" y="438" width="280" height="96" rx="12"/>
  <text class="head" x="180" y="470" text-anchor="middle">Solidarity</text>
  <text class="sub" x="180" y="494" text-anchor="middle">uniform positive rescaling of</text>
  <text class="sub" x="180" y="494" text-anchor="middle" dy="14">all claim strengths</text>
  <text class="sub" x="180" y="494" text-anchor="middle" dy="28">preserves every verdict</text>

  <!-- bottom-right: monotonicity -->
  <rect class="pill" x="520" y="438" width="280" height="96" rx="12"/>
  <text class="head" x="660" y="470" text-anchor="middle">Monotonicity</text>
  <text class="sub" x="660" y="494" text-anchor="middle">strengthening one claim never</text>
  <text class="sub" x="660" y="494" text-anchor="middle" dy="14">flips another claimant</text>
  <text class="sub" x="660" y="494" text-anchor="middle" dy="28">from Permit to Deny</text>

  <!-- center: the stage -->
  <rect x="225" y="248" width="390" height="118" rx="12" fill="#ffffff" stroke="#a13b34" stroke-width="2"/>
  <text class="core" x="420" y="278" text-anchor="middle">reachable scarce allocation stage</text>
  <text class="coresub" x="420" y="302" text-anchor="middle">claimant-symmetric &#183; finite-estate-coupled &#183;</text>
  <text class="coresub" x="420" y="302" text-anchor="middle" dy="16">an admissible over-subscribed profile exists</text>
  <text class="verdict" x="420" y="348" text-anchor="middle">at most two can hold &#8212; the third is a declared sacrifice</text>
</svg>
