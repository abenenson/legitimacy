name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  verify:
    name: Canonical verify gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Set up Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - uses: Swatinem/rust-cache@v2
      - name: Run canonical fast verification gate
        run: bash scripts/verify.sh

  reproduce-audit:
    name: Reproduce audit-agent bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Set up Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - uses: Swatinem/rust-cache@v2
      - name: Reproduce theorem-backed audit-agent lanes
        run: bash scripts/reproduce-audit.sh

  release-candidate:
    name: Release candidate gate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Set up Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - uses: Swatinem/rust-cache@v2
      - name: Run release gate candidate check
        run: bash scripts/verify.sh --release-gate
