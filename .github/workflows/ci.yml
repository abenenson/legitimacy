name: CI

on:
  # Heavy verification is intentionally manual. The publish path runs the same
  # scripts independently on the trusted release host before any public action.
  workflow_dispatch:
    inputs:
      gate:
        description: Gate to run
        required: true
        default: verify
        type: choice
        options:
          - verify
          - reproduce-audit
          - all
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Canonical verify gate
    if: github.event_name == 'workflow_dispatch' && (inputs.gate == 'verify' || inputs.gate == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt
      - name: Set up Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Run canonical fast verification gate
        run: bash scripts/verify.sh

  reproduce-audit:
    name: Reproduce audit-agent bundles
    if: github.event_name == 'workflow_dispatch' && (inputs.gate == 'reproduce-audit' || inputs.gate == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt
      - name: Set up Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Reproduce theorem-backed audit-agent lanes
        run: bash scripts/reproduce-audit.sh

  release-candidate:
    name: Release candidate gate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt
      - name: Set up Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Run release gate candidate check
        run: bash scripts/verify.sh --release-gate
