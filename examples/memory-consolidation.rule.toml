[rule]
name = "memory-consolidation"
version = "1.0"

[claimants]
type = "MemoryCandidate"
id_field = "memory_id"

[estate]
type = "DurableMemoryBudget"
total = 24.0
unit = "slots"

[claims]
ordering = "retention_score"

[priority_classes]
episodic = { level = 0 }
semantic = { level = 1 }

[family]
reductions = "remove_any_single_claimant"
shocks = [0.5, 0.9, 1.1, 1.5]
strengthening = [0.05, 0.2, 0.8]
